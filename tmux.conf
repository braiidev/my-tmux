# ============================================================================
#  my-tmux — configuración principal de tmux
# ============================================================================
#  Organización del archivo:
#    [1] Generales / terminal
#    [2] Prefijo y binding base
#    [3] Panes: navegación y resize (hjkl / HJKL)
#    [4] Windows y sesiones
#    [5] Layouts
#    [6] Status bar (posición + formato)
#    [7] Programitas (state/): sound, network, border, themes, update, screensaver
#    [8] Fuente de la verdad para temas (apply/cycle)
#    [9] Auto-update (estilo Clock/Player)
#   [10] Screensaver (matrix, colores del tema)
#   [11] machine.conf — overrides LOCALES por máquina (se sourcea al final)
#
#  Paths: todo vive bajo $HOME/.config/tmux (instalación estándar del repo).
# ============================================================================


# ----------------------------------------------------------------------------
# [1] Generales / terminal
# ----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g status-interval 1


# ----------------------------------------------------------------------------
# [2] Prefijo y binding base
#    Prefijo: C-b → M-a  (send-prefix y desbindear los viejos)
# ----------------------------------------------------------------------------
set -g prefix M-a
bind M-a send-prefix
unbind M-Space
unbind C-b


# ----------------------------------------------------------------------------
# [3] Panes: navegación y resize (vim-style)
#    Alt+hjkl      -> mover entre panes
#    Alt+HJKL      -> redimensionar panes
#    Alt+z         -> zoom
#    Alt+s / Alt-S -> split horizontal / vertical
#    Alt+x         -> cerrar pane con confirmación
# ----------------------------------------------------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L
bind -n M-J resize-pane -D
bind -n M-K resize-pane -U
bind -n M-L resize-pane -R

bind -n M-z resize-pane -Z
bind -n M-s split-window -v
bind -n M-S split-window -h
bind -n M-x confirm-before -p "¿Cerrar pane #P? (y/N)" kill-pane

bind M-n swap-pane -t :+
bind M-b swap-pane -t :-
bind M-m choose-tree -Zw "swap-pane -t '%%'"
bind -n M-> swap-pane -t +1
bind -n M-< swap-pane -t -1


# ----------------------------------------------------------------------------
# [4] Windows y sesiones
#    Alt+b / Alt+n   -> window anterior / siguiente
#    Alt+c           -> nueva window en el path actual
#    Alt+N / Alt+B   -> swap window +1 / -1
#    Alt-r           -> recargar configuración
#    Alt+Escape      -> detach
#    Alt+X           -> cerrar window con confirmación
#    Alt+w           -> nueva sesión
#    Alt+W           -> cerrar sesión con confirmación
#    Alt+[ / Alt+]   -> switch de sesión prev/sig
# ----------------------------------------------------------------------------
bind -n M-b previous-window
bind -n M-n next-window
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-N swap-window -t +1
bind -n M-B swap-window -t -1
bind R source-file ~/.config/tmux/tmux.conf
bind -n M-Escape detach-client
bind -n M-X confirm-before -p "¿Cerrar '#W'? (y/N)" kill-window
bind -n M-w new-session
bind -n M-W confirm-before -p "Cerrar sesión '#S'? (y/N)" "run-shell 'tmux switch-client -n 2>/dev/null; tmux kill-session -t \"#S\"'"
bind -n M-[ switch-client -p
bind -n M-] switch-client -n

# Alias a comandos (:split, :vsplit, :tnew)
set -g command-alias[100] split='split-window -v'
set -g command-alias[101] vsplit='split-window -h'
set -g command-alias[102] tnew='new-window'


# ----------------------------------------------------------------------------
# [5] Layouts
#    M-0 -> abrir workspace-tmux (Desktop: 4 panes, panel derecho apilado)
#    M-h -> layout main-vertical (pane principal a la izquierda, 70%)
#    M-l -> layout main-horizontal (pane principal arriba, 70%)
#    M-j -> layout tiled
#    M-: -> command-prompt (Alt+:)
# ----------------------------------------------------------------------------
bind -n M-: command-prompt
bind M-0 run-shell '~/.config/tmux/workspace-tmux'
bind M-h run-shell ' \
    panes_count=$(tmux display-message -p "#{window_panes}"); \
    if [ "$panes_count" -gt 1 ]; then \
        tmux set-window-option main-pane-width 70%; \
        tmux select-layout main-vertical; \
    fi \
'
bind M-l run-shell ' \
    panes_count=$(tmux display-message -p "#{window_panes}"); \
    if [ "$panes_count" -gt 1 ]; then \
        tmux set-window-option main-pane-height 70%; \
        tmux select-layout main-horizontal; \
    fi \
'
bind M-j select-layout tiled


# ----------------------------------------------------------------------------
# [6] Status bar (posición + formato base)
#    La definición de COLORES del status la aplica themes/theme.sh (abajo).
#    Acá queda la posición, el formato de texto y el contenido (status-left/right).
# ----------------------------------------------------------------------------
set -g status-position top
set -g status-style "bg=colour0,fg=colour7"
set -g status-justify left

# --- Status left: Session name + host ---------------------------------------
set -g status-left-length 80
set -g status-left "#[fg=colour4,bold]|#[fg=default] #[underscore]#S#[nounderscore] #h v0.3 #[fg=colour4]| "

# --- Status right: sound + network + fecha/hora ------------------------------
set -g status-right-length 40
set -g status-right "#(sh ~/.config/tmux/state/sound) #[fg=colour4,bold]|#[fg=default] #(cat ~/.config/tmux/cache/network 2>/dev/null || echo '?') #[fg=colour4,bold]|#[fg=default] %a #[fg=colour6]%d#[fg=default] %b, %H:%M #[fg=colour4]|"

# --- Status content (windows) ------------------------------------------------
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour4,bold][#[fg=default]#I:#W#[fg=colour4]]"

# --- Mensajes ----------------------------------------------------------------
set -g message-style "bg=colour3,fg=colour7,bold"
set -g message-command-style "bg=colour3,fg=colour7"


# ----------------------------------------------------------------------------
# [7] PROGRAMITAS (state/) — lógica y arranque
#    Cada uno con responsabilidad única; acá se cablean a tmux.
# ----------------------------------------------------------------------------

# --- [7.1] Sound (wpctl) -----------------------------------------------------
#   state/sound devuelve el estado del volumen: "🕪" (o "SOUND ON" con --compatible).
#   Bindings a tplay (reproductor): n/b/m/p/+/-  ← control multimedia.
bind n run-shell "tplay --ctl -q next"
bind b run-shell "tplay --ctl -q prev"
bind m run-shell "tplay --ctl -q mute"
bind p run-shell "tplay --ctl -q toggle"
bind + run-shell "tplay --ctl -q vol+"
bind - run-shell "tplay --ctl -q vol-"

# --- [7.2] Network -----------------------------------------------------------
#   state/network-daemon cachea estado de red cada 5s en cache/network.
#   El status-right lee ese cache (evita correr `ip`/`iw` en cada render).
#   IMPORTANTE (máquinas nuevas): asegura que cache/ exista antes del nohup.
run-shell 'mkdir -p ~/.config/tmux/cache && pgrep -x "network-daemon" > /dev/null || nohup ~/.config/tmux/state/network-daemon > ~/.config/tmux/cache/network-daemon.log 2>&1 &'

# --- [7.3] Border (bordes de pane + estado en SQLite) -------------------------
#   state/border.py persiste pane-border-status en data/mem.db.
#   bind 0 alterna el estado; al cargar se restaura el guardado.
run-shell "~/.config/tmux/state/border.py border-read | xargs -I {} tmux set pane-border-status {}"
bind 0 run-shell "~/.config/tmux/state/border.py border-toggle"

set -g pane-border-status off
set -g pane-border-format "#[align=centre]#{?pane_active,#[bold]↓ #{pane_current_command} ↓,#[fg=default]#{pane_index}}"
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=colour6,bold"
set -g pane-border-lines simple


# ----------------------------------------------------------------------------
# [8] TEMAS (clasico/mono/calido/alto_contraste/flatline)
#    theme.sh apply  → aplica el tema guardado en themes/current
#    M-t             → cicla al siguiente tema (guarda y aplica)
#    Los colores del prompt zsh (p10k) se leen del mismo themes/current.
# ----------------------------------------------------------------------------
run-shell "~/.config/tmux/themes/theme.sh apply"
bind -n M-t run-shell "~/.config/tmux/themes/theme.sh cycle"


# ----------------------------------------------------------------------------
# [9] AUTO-UPDATE (estilo Clock/Player)
#    update.sh check        → verifica 1x/hora y actualiza si hay nuevos commits
#    M-u                    → forzar check e instalar si hay novedades
#    Requiere instalación con .git (install.sh conserva el repo).
# ----------------------------------------------------------------------------
run-shell "~/.config/tmux/update.sh check"
bind M-u run-shell "~/.config/tmux/update.sh check --force"


# ----------------------------------------------------------------------------
# [10] MATRIX SCREENSAVER
#    ` (backtick) → alternar pantalla de screensaver (nueva window o matar)
#    Adopta los colores del theme de tmux activo (themes/current).
# ----------------------------------------------------------------------------
bind ` if-shell "tmux list-windows -F '#{window_name}' | grep -qx screensaver" "kill-window -t screensaver" "new-window -n screensaver 'python3 ~/.config/tmux/screensaver.py'"


# ----------------------------------------------------------------------------
# [11] MACHINE.CONF — overrides LOCALES (NUNCA pisados por el git pull)
#    Este archivo está en .gitignore. Source condicional: si no existe,
#    el resto de la config funciona igual.
#    Edición: M-e → abre machine.conf en $EDITOR (state/edit-config).
#    Si guardás cambios, recarga tmux.conf y reinicia network-daemon al toque.
#    Uso típico: activar "compatible = true" en máquinas sin glifos nerd.
#    Ver machine.conf.example en el repo (o ~/.config/tmux/machine.conf.example).
# ----------------------------------------------------------------------------
if-shell "test -f ~/.config/tmux/machine.conf" "source-file ~/.config/tmux/machine.conf"
bind -n M-e run-shell "~/.config/tmux/state/edit-config"