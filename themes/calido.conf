# Tema: calido
# marco=YELLOW(3) texto=WHITE(7) clima=RED(1) helpers=YELLOW(3) nav=RED(1)
set -g status-style "bg=colour0,fg=colour7"
set -g status-left "#[fg=colour3,bold]|#[fg=default] #[underscore]#S#[nounderscore] #h #[fg=colour3]| "
set -g status-right "#(sh ~/.config/tmux/state/sound) #[fg=colour3,bold]|#[fg=default] #(cat ~/.config/tmux/cache/network 2>/dev/null || echo '?') #[fg=colour3,bold]|#[fg=default] #[fg=colour1]%a %d#[fg=default] %b, %H:%M #[fg=colour3]|"
set -g window-status-current-format "#[fg=colour3,bold][#[fg=default]#I:#W#[fg=colour3]]"
set -g message-style "bg=colour3,fg=colour7,bold"
set -g pane-active-border-style "fg=colour1,bold"
set -g pane-border-style "fg=colour7"